# 逍遥游服务端配置

# ==================== 数据库配置 ====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/xiaoyao_game?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# Druid 连接池
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.cache-enabled=false
# 开发环境开启 SQL 日志
# mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== Redis 配置 ====================
# redis.host=127.0.0.1
# redis.port=6379
# redis.password=
# redis.database=0

# ==================== 游戏服务配置 ====================
game.server.websocket-port=10100
game.server.logic-port=10200
