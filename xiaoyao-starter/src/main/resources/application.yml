# Spring Boot 4.0 + MyBatis-Flex 配置
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/xiaoyao_game?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP 连接池配置 (Spring Boot 4.0 默认)
    hikari:
      # 连接池大小
      maximum-pool-size: 20
      minimum-idle: 5

      # 超时配置
      connection-timeout: 30000  # 30秒
      idle-timeout: 600000        # 10分钟
      max-lifetime: 1800000       # 30分钟

      # 连接测试
      connection-test-query: SELECT 1

      # 连接池名称
      pool-name: XiaoyaoHikariCP

# MyBatis-Flex 配置
mybatis-flex:
  # MyBatis 配置
  configuration:
    # 开启 SQL 日志 (开发环境)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰命名映射
    map-underscore-to-camel-case: true
    # 关闭二级缓存
    cache-enabled: false

  # 全局配置
  global-config:
    # 逻辑删除配置
    logic-delete-column: is_deleted
    logic-delete-value: 1
    logic-not-delete-value: 0

    # 显示 MyBatis-Flex Banner
    banner: true
